openapi: 3.1.0
info:
  title: Lexora API
  version: 0.1.0
  description: AI legal assistant platform. Spec-first contract.
servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: service ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      summary: Login with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: logged in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh cookie, issue new access token
      security: []
      responses:
        "200":
          description: refreshed
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke refresh token
      responses:
        "204":
          description: logged out
          headers:
            Set-Cookie:
              schema:
                type: string

  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change own password (also clears must_change_password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: changed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /organizations:
    post:
      operationId: createOrganization
      summary: Create org + first org admin (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: listOrganizations
      summary: List organizations (super admin only)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /members:
    post:
      operationId: addMember
      summary: Add member to own org (org admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMemberResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: listMembers
      summary: List members of own org (org admin only)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /members/{userId}:
    patch:
      operationId: updateMember
      summary: Set member role / active (org admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /documents:
    post:
      operationId: uploadDocument
      summary: Upload a document for ingestion (org admin). Returns 202.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: listDocuments
      summary: List documents of own org (paginated)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "403":
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorResponse:
      description: error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: pesan aman untuk user

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: access token lifetime in seconds
        must_change_password:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    Organization:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name, slug, admin_email, admin_full_name]
      properties:
        name:
          type: string
        slug:
          type: string
        admin_email:
          type: string
          format: email
        admin_full_name:
          type: string

    CreateOrganizationResponse:
      type: object
      required: [organization, admin]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        admin:
          $ref: "#/components/schemas/AddMemberResponse"

    AddMemberRequest:
      type: object
      required: [email, full_name, role]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [org_admin, member]

    AddMemberResponse:
      type: object
      required: [user_id, email, temp_password]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        temp_password:
          type: string
          description: one-time temp password; user must change on first login

    Member:
      type: object
      required: [user_id, email, full_name, role, is_active]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [org_admin, member]
        is_active:
          type: boolean

    UpdateMemberRequest:
      type: object
      properties:
        role:
          type: string
          enum: [org_admin, member]
        is_active:
          type: boolean

    Document:
      type: object
      required: [id, file_name, mime_type, file_size, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        scope:
          type: string
          enum: [knowledge_base, user]
        status:
          type: string
          enum: [uploaded, processing, indexed, failed]
        error:
          type: string
        created_at:
          type: string
          format: date-time
