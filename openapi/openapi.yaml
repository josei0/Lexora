openapi: 3.1.0
info:
  title: Lexora API
  version: 0.1.0
  description: AI legal assistant platform. Spec-first contract.
servers:
  - url: http://localhost:8080

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: service ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
