# infra: qdrant saja. Postgres pakai instalasi native host (PG 18) di :5432 —
# dua-duanya di :5432 bikin container ke-shadow diam-diam dan data seolah hilang.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

volumes:
  qdrantdata:
